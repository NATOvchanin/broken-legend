<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talebreak</title>
    <style>
        html, body, * {
            cursor: url('assets/cur.png') 3 1, auto;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', cursive;
            text-align: center;
        }

        .msg {
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700;
            font-size: 22px;
            line-height: 1.8;
            padding: 0 20px;
        }

        .msg.en {
            margin-top: 40px;
            font-size: 16px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="msg ru">ИДЁТ ОБНОВЛЕНИЕ САЙТА, ПОДОЖДИТЕ</div>
    <div class="msg en">SITE IS BEING UPDATED, PLEASE WAIT</div>
</body>
</html>
